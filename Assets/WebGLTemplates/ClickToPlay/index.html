<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden; background: {{{ BACKGROUND_COLOR }}}; }
      #unity-canvas { display: block; width: 100%; height: 100%; }
      #click-to-play {
        position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
        text-align: center; font: 24px sans-serif; color: #fff; text-shadow: 0 0 4px #000;
        pointer-events: none; user-select: none;
      }
      #click-to-play[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="click-to-play">Click to play</div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // The one permitted prompt: a single line, shown whenever the browser does not
      // hold pointer lock on the canvas (before the first click and after Esc).
      // pointer-events: none lets the click fall through to the canvas, where
      // PlayerController requests the lock.
      var canvas = document.querySelector("#unity-canvas");
      var hint = document.querySelector("#click-to-play");
      document.addEventListener("pointerlockchange", function () {
        hint.hidden = document.pointerLockElement === canvas;
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      });
    </script>
  </body>
</html>
